name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Delete existing release
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          
          # Create release and upload APK
          gh release create apk-latest "$APK" \
            --title "知日 APK - $SHORT_SHA" \
            --notes "Auto-built APK from commit $SHORT_SHA" \
            --prerelease
