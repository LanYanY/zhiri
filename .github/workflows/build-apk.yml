name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -15

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
          echo "APK size: $(( SIZE / 1024 / 1024 ))MB"
          
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          
          gh release create apk-latest "$APK" \
            --title "知日 APK (Latest)" \
            --notes "Auto-built from commit $(git rev-parse --short HEAD)" \
            --prerelease
