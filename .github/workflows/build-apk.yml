name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -15

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          
          SIZE=$(du -h "$APK" | cut -f1)
          echo "APK size: $SIZE"
          
          # Delete old release if exists
          gh release delete apk-latest --cleanup-tag 2>/dev/null || true
          git push --delete origin apk-latest 2>/dev/null || true
          
          # Create release with APK
          gh release create apk-latest "$APK" \
            --title "知日 APK (Latest)" \
            --notes "Auto-built APK from latest commit" \
            --prerelease
