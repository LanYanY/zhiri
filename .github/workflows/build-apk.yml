name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
          find . -name "*.apk" -type f

      - name: Debug Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo "=== Debug Info ==="
          echo "Tag: $TAG"
          echo "APK exists: $([ -f $APK ] && echo YES || echo NO)"
          [ -f "$APK" ] && echo "APK size: $(du -h $APK | cut -f1)"
          
          # Clean up existing release
          gh release delete "$TAG" --yes 2>&1 || true
          git push --delete origin "$TAG" 2>&1 || true
          git tag -d "$TAG" 2>&1 || true
          sleep 2
          
          # Delete release via API if still exists
          curl -s -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" 2>&1
          sleep 1
          
          # Recreate tag
          COMMIT_SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$COMMIT_SHA"
          git push origin "$TAG" --force 2>&1
          sleep 2
          
          # Create release via API
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"知日 APK $TAG\",
              \"prerelease\": true
            }" 2>&1
          
          echo "=== Release created, uploading APK ==="
          
          # Upload APK
          gh release upload "$TAG" "$APK" --clobber 2>&1
          
          echo "=== Done ==="
