name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -10

      - name: Commit APK to apk branch
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p apk-output
          cp "$APK" apk-output/zhiri-debug.apk
          
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan apk-branch 2>/dev/null || git checkout apk-branch
          git rm -rf . 2>/dev/null || true
          mv apk-output/zhiri-debug.apk ./zhiri-debug.apk
          git add -f zhiri-debug.apk
          git commit -m "Auto-built APK from $(git rev-parse --short HEAD) at $(date)"
          git push -f origin apk-branch 2>&1
