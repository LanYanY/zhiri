name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee /tmp/gradle.log
          echo "=== EXIT CODE: ${PIPESTATUS[0]} ==="
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== APK Directory ==="
          ls -laR app/build/outputs/apk/ 2>/dev/null || echo "APK output dir not found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/gradle.log

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "知日 APK ${{ github.ref_name }}"
          prerelease: true
          body: "Auto-built APK"
          files: android/app/build/outputs/apk/debug/app-debug.apk
