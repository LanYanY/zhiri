name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -10

      - name: Commit APK to apk branch
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          # Create or switch to apk branch
          git fetch origin apk-branch 2>/dev/null && git checkout apk-branch || git checkout --orphan apk-branch
          git rm -rf . 2>/dev/null || true
          mkdir -p release
          cp "$APK" release/zhiri-debug.apk
          git add -f release/zhiri-debug.apk
          git commit -m "Auto-built APK from $(git rev-parse origin/main 2>/dev/null | cut -c1-7)"
          git push -f origin apk-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
