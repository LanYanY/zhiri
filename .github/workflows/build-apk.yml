name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
          find . -name "*.apk" -type f

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          # Check if release already exists and delete it
          gh release view "$TAG" 2>/dev/null && gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          
          # Create release and upload APK
          gh release create "$TAG" "$APK" \
            --title "知日 APK $TAG" \
            --notes "Auto-built APK" \
            --prerelease
